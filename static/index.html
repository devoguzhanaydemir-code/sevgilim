<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sana Özel 💛</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    background:linear-gradient(160deg,#0b1030,#1a1440 55%,#2b1b3d);color:#fff;
    display:flex;align-items:center;justify-content:center;padding:24px}
  .wrap{width:100%;max-width:760px;text-align:center}
  h1{font-size:34px;margin:0 0 6px;color:#ffd54f;text-shadow:0 0 24px #ffd54f80}
  p.alt{margin:0 0 28px;color:#cfd8dc}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px}
  a.kutu{display:block;text-decoration:none;color:inherit;background:#ffffff12;border:1px solid #ffffff22;
    border-radius:22px;padding:26px 18px;transition:transform .15s,background .15s,box-shadow .15s}
  a.kutu:hover{transform:translateY(-4px);background:#ffffff1f;box-shadow:0 10px 30px #00000055}
  .ikon{font-size:54px;display:block;margin-bottom:10px}
  .ad{font-size:20px;font-weight:800;margin-bottom:4px}
  .aciklama{font-size:14px;color:#cfd8dc}
  footer{margin-top:28px;color:#ffd54f;font-size:14px}
</style>
</head>
<body>
  <div class="wrap">
    <h1>Sana Özel 💛</h1>
    <p class="alt">Küçük bir köşe — istediğine dokun</p>
    <div class="grid">
      <a class="kutu" href="oyun/">
        <span class="ikon">👩‍⚕️</span>
        <div class="ad">Nöbetteki Hemşire</div>
        <div class="aciklama">5 hastayı iyileştir, hata hakkın yok</div>
      </a>
      <a class="kutu" href="kelime.html">
        <span class="ikon">🔤</span>
        <div class="ad">Kelime Oyunu</div>
        <div class="aciklama">İkimiz, iki bilgisayar, canlı</div>
      </a>
    </div>
    <footer>— Oğuzhan</footer>
  </div>
</body>
</html>
