<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kelime Oyunu 🔤</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    background:linear-gradient(160deg,#10162e,#1c1636 55%,#2a1b3a);color:#fff;
    display:flex;justify-content:center;padding:14px}
  .wrap{width:100%;max-width:760px}
  a.geri{color:#b0bec5;font-size:14px;text-decoration:none}
  h1{font-size:25px;margin:6px 0 2px;text-align:center;color:#ffd54f}
  p.alt{margin:0 0 12px;text-align:center;color:#b0bec5;font-size:13px}
  .kart{background:#ffffff10;border:1px solid #ffffff20;border-radius:18px;padding:16px;margin-bottom:12px}
  button{font:inherit;border:0;border-radius:14px;padding:9px 16px;background:#ffd54f;color:#1a1440;
    font-weight:800;cursor:pointer}
  button.ik{background:#4dd0e1;color:#06323f}
  button.uc{background:#ffffff22;color:#fff}
  button:disabled{opacity:.4;cursor:default}
  input{font:inherit;padding:9px 12px;border:2px solid #4dd0e1;border-radius:12px;background:#00000033;
    color:#fff;outline:none;width:110px;text-transform:uppercase}
  #kod{font-size:30px;font-weight:800;letter-spacing:7px;color:#ffd54f;margin:8px 0 0;text-align:center}
  #oyun{display:none}
  .skor{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;font-size:14px}
  .skor .p{background:#ffffff14;border-radius:14px;padding:6px 14px}
  .skor .p.sira{background:#ffd54f;color:#1a1440;font-weight:800}
  #tahta{display:grid;grid-template-columns:repeat(15,1fr);gap:2px;margin:12px auto;width:100%;max-width:480px}
  .h{position:relative;aspect-ratio:1;border-radius:4px;background:#ffffff14;display:flex;align-items:center;
    justify-content:center;font-size:10px;font-weight:700;color:#ffffff66;cursor:pointer;user-select:none}
  .h.k3{background:#e53935cc;color:#fff}
  .h.k2{background:#f06292cc;color:#fff}
  .h.h3{background:#1e88e5cc;color:#fff}
  .h.h2{background:#4dd0e1aa;color:#06323f}
  .h.merkez{background:#ffd54fcc;color:#1a1440}
  .h.tas{background:linear-gradient(160deg,#fff8e1,#ffe082);color:#1a1440;font-size:15px;
    box-shadow:0 2px 0 #00000055}
  .h.yeni{outline:2px solid #4dd0e1}
  .h.joker{color:#b71c1c}
  .h sub{position:absolute;right:2px;bottom:1px;font-size:7px;opacity:.75}
  #el{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:10px 0}
  .t{width:42px;height:46px;border-radius:9px;background:linear-gradient(160deg,#fff8e1,#ffe082);color:#1a1440;
    display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:800;cursor:pointer;
    position:relative;box-shadow:0 3px 0 #00000055;user-select:none}
  .t.sec{outline:3px solid #4dd0e1;transform:translateY(-4px)}
  .t.degis{outline:3px solid #ef5350}
  .t sub{position:absolute;right:3px;bottom:1px;font-size:9px}
  .dugmeler{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
  #kayit{max-height:130px;overflow:auto;font-size:13px;color:#cfd8dc;margin-top:10px}
  #kayit div{padding:3px 0;border-bottom:1px dashed #ffffff18}
  .uyari{min-height:20px;text-align:center;font-size:14px;color:#ffab91;margin-top:8px}
  .kucuk{font-size:12px;color:#90a4ae;text-align:center}
  #jokerPerde{position:fixed;inset:0;background:#000d1ae6;display:none;align-items:center;justify-content:center;
    padding:20px;z-index:99}
  #jokerPerde .k{background:#1c1636;border:1px solid #ffffff33;border-radius:20px;padding:20px;max-width:420px;text-align:center}
  #jokerPerde .harfler{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:12px}
  #jokerPerde .harfler button{padding:8px 12px;border-radius:10px}
  footer{margin-top:14px;text-align:center;color:#ffd54f;font-size:14px}

  body{background:linear-gradient(-45deg,#10162e,#1c1636,#2a1b3a,#141b3d);background-size:400% 400%;animation:akis 18s ease infinite}
  @keyframes akis{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
  h1{background:linear-gradient(90deg,#ffd54f,#ff8a80,#4dd0e1,#ffd54f);background-size:300% 100%;
    -webkit-background-clip:text;background-clip:text;color:transparent;animation:kayan 6s linear infinite;font-weight:900}
  @keyframes kayan{to{background-position:300% 0}}
  .kart{backdrop-filter:blur(6px);box-shadow:0 10px 30px #00000044}
  .skor .p.sira{box-shadow:0 0 18px #ffd54f88;animation:nabiz 1.8s ease-in-out infinite}
  @keyframes nabiz{50%{box-shadow:0 0 30px #ffd54fcc}}
  .h.k3,.h.k2,.h.h3,.h.h2{overflow:hidden}
  .h.k3::after,.h.k2::after,.h.h3::after,.h.h2::after{content:"";position:absolute;inset:0;
    background:linear-gradient(115deg,transparent 40%,#ffffff55 50%,transparent 60%);
    transform:translateX(-130%);animation:parla 5s ease-in-out infinite}
  @keyframes parla{0%,70%{transform:translateX(-130%)}88%,100%{transform:translateX(130%)}}
  .h.tas{animation:dus .22s cubic-bezier(.2,1.4,.4,1)}
  @keyframes dus{from{transform:scale(1.6) translateY(-12px);opacity:.2}to{transform:none;opacity:1}}
  .h.yeni{box-shadow:0 0 12px #4dd0e1cc}
  .t:hover{transform:translateY(-3px)}
  button{transition:transform .12s,filter .12s}
  button:hover:not(:disabled){transform:translateY(-2px);filter:brightness(1.1)}
  #anlamlar{margin-top:10px;font-size:13px;color:#e0f7fa}
  #anlamlar .anlam{background:#4dd0e11a;border-left:3px solid #4dd0e1;border-radius:8px;padding:6px 10px;margin-top:6px;animation:gir .25s ease-out}
  #anlamlar b{color:#ffd54f}
  .sohbetUst{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;color:#ffd54f;font-size:15px}
  .mini{padding:4px 10px;border-radius:10px;background:#ffffff22;color:#fff;font-size:15px}
  #sohbet{height:150px;overflow:auto;display:flex;flex-direction:column;gap:6px;padding-right:4px}
  .msj{max-width:80%;padding:7px 12px;border-radius:14px;font-size:14px;word-break:break-word;animation:gir .2s ease-out}
  @keyframes gir{from{opacity:0;transform:translateY(6px)}}
  .msj.ben{align-self:flex-end;background:#ffd54f;color:#1a1440;border-bottom-right-radius:4px}
  .msj.o{align-self:flex-start;background:#ffffff1f;border-bottom-left-radius:4px}
  .emojiBar{display:flex;gap:4px;flex-wrap:wrap;margin:8px 0}
  .emojiBar button{padding:3px 8px;border-radius:10px;background:#ffffff18;font-size:18px}
  .sohbetAlt{display:flex;gap:6px}
  #sohbetGiris{flex:1;width:auto;text-transform:none}
  .kalpBtn{background:#ec407a;color:#fff;font-size:18px}
  .patlama{position:fixed;inset:0;pointer-events:none;z-index:200}
  .patlama span{position:absolute;animation:ucus 2.2s ease-out forwards}
  @keyframes ucus{0%{transform:scale(.3);opacity:0}15%{transform:scale(1.25);opacity:1}100%{transform:translateY(-230px) scale(.9) rotate(25deg);opacity:0}}

  .emj{-webkit-text-fill-color:initial}
  .lobi{text-align:center;position:relative;overflow:hidden;
    background:linear-gradient(160deg,#ffffff18,#ffffff08);border:1px solid #ffffff2e}
  .lobi::before{content:"";position:absolute;inset:-45%;pointer-events:none;
    background:radial-gradient(circle at 30% 20%,#ffd54f26,transparent 45%),radial-gradient(circle at 75% 80%,#ec407a30,transparent 45%);
    animation:doner 22s linear infinite}
  @keyframes doner{to{transform:rotate(360deg)}}
  .lobi>*{position:relative;z-index:1}
  .kalpler{font-size:30px;letter-spacing:10px;animation:sek 2.6s ease-in-out infinite}
  @keyframes sek{50%{transform:translateY(-6px) scale(1.06)}}
  .lobiBaslik{margin:8px 0 2px;font-size:24px;color:#fff;font-weight:800}
  .lobiBaslik span{color:#ec407a}
  .lobiAlt{margin:0 0 14px;color:#b0bec5;font-size:14px}
  .kimler{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
  .kim{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:132px;padding:14px 18px;
    border-radius:20px;background:#ffffff14;color:#fff;font-size:28px;border:2px solid transparent}
  .kim span{font-size:15px;font-weight:700}
  .kim.secili{background:#ffd54f;color:#1a1440;border-color:#fff;box-shadow:0 0 22px #ffd54f77}
  .ayrac{display:flex;align-items:center;gap:10px;margin:18px 0 12px;color:#78909c;font-size:11px;letter-spacing:3px}
  .ayrac::before,.ayrac::after{content:"";flex:1;height:1px;background:#ffffff22}
  #kod{animation:nabiz2 2s ease-in-out infinite}
  @keyframes nabiz2{50%{text-shadow:0 0 26px #ffd54f}}
  .lobiBilgi{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:16px}
  .rozetMini{font-size:11px;background:#ffffff12;border:1px solid #ffffff20;border-radius:999px;padding:4px 12px;color:#90a4ae}
  .msjAd{display:block;font-size:10px;opacity:.65;font-style:normal;margin-bottom:2px}
</style>
</head>
<body>
<div class="wrap">
  <a class="geri" href="./">← ana sayfa</a>
  <h1>Kelime Oyunu <span class="emj">🔤</span></h1>
  <p class="alt">İki bilgisayar, tam Scrabble kuralları, gerçek Türkçe sözlük</p>

  <div class="kart lobi" id="giris">
    <div class="kalpler">💗 💛</div>
    <h2 class="lobiBaslik">Ayşe Nur <span>&amp;</span> Oğuzhan</h2>
    <p class="lobiAlt">Bu bilgisayarda kim oynuyor?</p>
    <div class="kimler">
      <button class="kim" data-ad="Ayşe Nur">💗<span>Ayşe Nur</span></button>
      <button class="kim" data-ad="Oğuzhan">💛<span>Oğuzhan</span></button>
    </div>
    <div class="ayrac">ODA</div>
    <div class="dugmeler">
      <button id="kurBtn">✨ Oda kur</button>
      <input id="kodGiris" placeholder="KOD" maxlength="4">
      <button class="ik" id="katilBtn">Katıl →</button>
    </div>
    <p id="durum" class="kucuk" style="margin-bottom:0">Önce kim olduğunu seç.</p>
    <p id="kod"></p>
    <div class="lobiBilgi">
      <span class="rozetMini" id="sozlukDurum">Sözlük yükleniyor…</span>
      <span class="rozetMini">15×15 tahta · 100 taş · TDK anlamları</span>
    </div>
  </div>

  <div id="oyun">
    <div class="kart">
      <div class="skor">
        <span class="p" id="pBen">Sen: 0</span>
        <span class="kucuk" id="torba">Torba: 0</span>
        <span class="p" id="pO">O: 0</span>
      </div>
      <div id="tahta"></div>
      <div id="el"></div>
      <div class="dugmeler">
        <button id="onay">✓ Onayla</button>
        <button class="uc" id="geriAl">↩︎ Geri al</button>
        <button class="ik" id="pas">Pas</button>
        <button class="ik" id="degistir">Değiştir</button>
      </div>
      <div class="uyari" id="uyari"></div>
      <div id="kayit"></div>
      <div id="anlamlar"></div>
    </div>

    <div class="kart">
      <div class="sohbetUst"><b>Sohbet 💬</b><button class="mini" id="sesBtn">🔊 Ses açık</button></div>
      <div id="sohbet"></div>
      <div class="emojiBar" id="emojiBar"></div>
      <div class="sohbetAlt">
        <input id="sohbetGiris" placeholder="Bir şeyler yaz…" maxlength="120">
        <button id="sohbetGonder">Gönder</button>
        <button class="kalpBtn" id="kalpBtn">💖</button>
      </div>
    </div>
  </div>
  <footer>— Oğuzhan 💛</footer>
</div>

<div id="jokerPerde"><div class="k">
  <b>Joker hangi harf olsun?</b>
  <div class="harfler" id="jokerHarfler"></div>
</div></div>

<script>
const $ = id => document.getElementById(id);

/* ---------------- sözlük ---------------- */
const SOZLUK = new Set();
let sozlukHazir = false;
const KAYNAKLAR = [
  "https://raw.githubusercontent.com/mertemin/turkish-word-list/master/words.txt",
  "https://raw.githubusercontent.com/CanNuhlar/Turkce-Kelime-Listesi/master/turkce_kelime_listesi.txt"
];
const gecerliKelimeMi = k => SOZLUK.has(k.toLocaleLowerCase("tr"));
(async ()=>{
  for(const u of KAYNAKLAR){
    try{
      const t = await (await fetch(u)).text();
      for(const s of t.split("\n")){
        const w = s.trim().toLocaleLowerCase("tr");
        if(w.length>=2 && w.length<=15 && /^[a-zçğıöşü]+$/.test(w)) SOZLUK.add(w);
      }
    }catch(e){}
  }
  sozlukHazir = SOZLUK.size > 1000;
  $("sozlukDurum").textContent = sozlukHazir
    ? "Sözlük hazır: " + SOZLUK.size.toLocaleString("tr") + " kelime"
    : "Sözlük yüklenemedi — kelime kontrolü kapalı.";
})();

/* ---------------- taşlar ---------------- */
const PUAN = {A:1,B:3,C:4,"Ç":4,D:3,E:1,F:7,G:5,"Ğ":8,H:5,"I":2,"İ":1,J:10,K:1,L:1,M:2,N:1,O:2,
  "Ö":7,P:5,R:1,S:2,"Ş":4,T:1,U:2,"Ü":3,V:7,Y:3,Z:4,"*":0};
const ADET = {A:12,B:2,C:2,"Ç":2,D:2,E:8,F:1,G:1,"Ğ":1,H:1,"I":4,"İ":7,J:1,K:7,L:7,M:4,N:5,O:3,
  "Ö":1,P:1,R:6,S:3,"Ş":2,T:5,U:3,"Ü":2,V:1,Y:2,Z:2,"*":2};
const HARFLER = Object.keys(PUAN).filter(h=>h!=="*");

/* ---------------- kareler ---------------- */
const K3=[[0,0],[0,7],[0,14],[7,0],[7,14],[14,0],[14,7],[14,14]];
const K2=[[1,1],[2,2],[3,3],[4,4],[10,10],[11,11],[12,12],[13,13],
          [1,13],[2,12],[3,11],[4,10],[10,4],[11,3],[12,2],[13,1]];
const H3=[[1,5],[1,9],[5,1],[5,5],[5,9],[5,13],[9,1],[9,5],[9,9],[9,13],[13,5],[13,9]];
const H2=[[0,3],[0,11],[2,6],[2,8],[3,0],[3,7],[3,14],[6,2],[6,6],[6,8],[6,12],[7,3],[7,11],
          [8,2],[8,6],[8,8],[8,12],[11,0],[11,7],[11,14],[12,6],[12,8],[14,3],[14,11]];
const CARPAN = {};
K3.forEach(([r,c])=>CARPAN[r*15+c]="k3");
K2.forEach(([r,c])=>CARPAN[r*15+c]="k2");
H3.forEach(([r,c])=>CARPAN[r*15+c]="h3");
H2.forEach(([r,c])=>CARPAN[r*15+c]="h2");
const MERKEZ = 7*15+7;

/* ---------------- durum ---------------- */
let peer=null, baglanti=null, benHost=false, benim=0;
let D = null;              // host'ta tam durum
let G = null;              // ekranda gösterilen durum
let gecici = [];           // {i, harf, joker, elIndex}
let secili = -1, degisModu = false, degisSecim = new Set();

const gonder = o => { if(baglanti && baglanti.open) baglanti.send(o); };
const rastgeleKod = ()=>Math.random().toString(36).slice(2,6).toUpperCase();

/* ---------------- kural motoru ---------------- */
function kelimeTopla(tahta, yerler){
  if(!yerler.length) return {hata:"Tahtaya taş koymadın."};
  if(yerler.some(y=>tahta[y.i])) return {hata:"Dolu kareye taş konamaz."};
  const idx = yerler.map(y=>y.i);
  if(new Set(idx).size !== idx.length) return {hata:"Aynı kareye iki taş konamaz."};

  const satir = new Set(idx.map(i=>Math.floor(i/15)));
  const sutun = new Set(idx.map(i=>i%15));
  if(satir.size>1 && sutun.size>1) return {hata:"Taşlar tek bir satırda ya da sütunda olmalı."};

  const t = tahta.slice();
  yerler.forEach(y=>t[y.i] = {h:y.harf, joker:y.joker});
  const yeni = new Set(idx);
  const bos = tahta.every(x=>!x);

  if(bos){
    if(!yeni.has(MERKEZ)) return {hata:"İlk kelime ortadaki yıldızdan geçmeli."};
    if(yerler.length<2) return {hata:"İlk kelime en az iki harf olmalı."};
  } else {
    const komsu = i => [i-15, i+15, (i%15)>0 ? i-1 : -1, (i%15)<14 ? i+1 : -1]
      .some(j=>j>=0 && j<225 && tahta[j]);
    if(!idx.some(komsu)) return {hata:"Yeni taşlar tahtadaki bir kelimeye değmeli."};
  }

  if(satir.size===1){
    const r = Math.floor(idx[0]/15);
    const cs = idx.map(i=>i%15);
    for(let c=Math.min(...cs); c<=Math.max(...cs); c++) if(!t[r*15+c]) return {hata:"Kelimede boşluk kalamaz."};
  }
  if(sutun.size===1){
    const c = idx[0]%15;
    const rs = idx.map(i=>Math.floor(i/15));
    for(let r=Math.min(...rs); r<=Math.max(...rs); r++) if(!t[r*15+c]) return {hata:"Kelimede boşluk kalamaz."};
  }

  const kelimeAl = (bas, adim)=>{
    let i = bas;
    while(true){
      const onceki = i - adim;
      if(onceki < 0 || onceki >= 225) break;
      if(adim===1 && Math.floor(onceki/15) !== Math.floor(i/15)) break;
      if(!t[onceki]) break;
      i = onceki;
    }
    const hucreler = [];
    while(i>=0 && i<225 && t[i]){
      hucreler.push(i);
      const sonraki = i + adim;
      if(adim===1 && Math.floor(sonraki/15) !== Math.floor(i/15)) break;
      i = sonraki;
    }
    return hucreler;
  };

  const kelimeler = [];
  const ekle = hucreler => {
    if(hucreler.length < 2) return;
    const anahtar = hucreler.join(",");
    if(kelimeler.some(k=>k.anahtar===anahtar)) return;
    const kelime = hucreler.map(i=>t[i].h).join("");
    let p = 0, wc = 1;
    for(const i of hucreler){
      let hp = t[i].joker ? 0 : PUAN[t[i].h];
      if(yeni.has(i)){
        const c = CARPAN[i];
        if(c==="h2") hp *= 2;
        if(c==="h3") hp *= 3;
        if(c==="k2" || i===MERKEZ) wc *= 2;
        if(c==="k3") wc *= 3;
      }
      p += hp;
    }
    kelimeler.push({anahtar, kelime, puan: p*wc});
  };

  const yatay = satir.size===1;
  if(yerler.length===1){
    ekle(kelimeAl(idx[0], 1));
    ekle(kelimeAl(idx[0], 15));
  } else {
    ekle(kelimeAl(idx[0], yatay ? 1 : 15));
    for(const i of idx) ekle(kelimeAl(i, yatay ? 15 : 1));
  }

  if(!kelimeler.length) return {hata:"En az iki harfli bir kelime oluşturmalısın."};

  if(sozlukHazir){
    const kotu = kelimeler.filter(k=>!gecerliKelimeMi(k.kelime));
    if(kotu.length) return {hata:"Sözlükte yok: " + kotu.map(k=>k.kelime).join(", ")};
  }

  let toplam = kelimeler.reduce((a,k)=>a+k.puan, 0);
  const bingo = yerler.length===7;
  if(bingo) toplam += 50;
  return {puan: toplam, kelimeler, bingo};
}

/* ---------------- host ---------------- */
function torbaKur(){
  const t = [];
  for(const h in ADET) for(let i=0;i<ADET[h];i++) t.push(h);
  for(let i=t.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [t[i],t[j]]=[t[j],t[i]]; }
  return t;
}
function doldur(el){ while(el.length<7 && D.torba.length) el.push(D.torba.pop()); }

function oyunuBaslat(){
  D = {tahta:Array(225).fill(null), torba:torbaKur(), eller:[[],[]], puan:[0,0], sira:0, pas:0,
       kayit:[], bitti:false};
  doldur(D.eller[0]); doldur(D.eller[1]);
  yayinla();
}
const gorunum = kim => ({tahta:D.tahta, el:D.eller[kim], puan:[D.puan[0],D.puan[1]], sira:D.sira,
  torba:D.torba.length, kayit:D.kayit, bitti:D.bitti});
function yayinla(){ G = gorunum(0); ciz(); gonder({tip:"durum", v:gorunum(1)}); }
function kayitEkle(o, m){ D.kayit.push({o, m}); if(D.kayit.length>40) D.kayit.shift(); }

function bitisKontrol(){
  const biten = [0,1].find(k=>D.eller[k].length===0);
  if(D.torba.length===0 && biten!==undefined){
    const diger = 1-biten;
    let ek = 0; for(const h of D.eller[diger]) ek += PUAN[h];
    D.puan[biten] += ek; D.puan[diger] -= ek;
    D.bitti = true;
    kayitEkle(biten, "taşları bitirdi (+" + ek + ")");
  }
  if(D.pas >= 4){ D.bitti = true; kayitEkle(D.sira, "üst üste paslar — oyun bitti"); }
}

function hamleIsle(kim, yerler){
  if(D.bitti) return {hata:"Oyun bitti."};
  if(D.sira!==kim) return {hata:"Sıra sende değil."};
  const el = D.eller[kim].slice();
  for(const y of yerler){
    const ara = y.joker ? "*" : y.harf;
    const p = el.indexOf(ara);
    if(p<0) return {hata:"Elinde olmayan taş kullanılamaz."};
    el.splice(p,1);
  }
  const s = kelimeTopla(D.tahta, yerler);
  if(s.hata) return {hata:s.hata};
  yerler.forEach(y=>D.tahta[y.i] = {h:y.harf, joker:y.joker});
  D.eller[kim] = el;
  doldur(D.eller[kim]);
  D.puan[kim] += s.puan;
  D.pas = 0;
  kayitEkle(kim, s.kelimeler.map(k=>k.kelime).join(" + ") + " · +" + s.puan + (s.bingo ? " (bingo +50!)" : ""));
  bitisKontrol();
  if(!D.bitti) D.sira = 1-kim;
  yayinla();
  return {ok:true};
}
function pasIsle(kim){
  if(D.bitti) return {hata:"Oyun bitti."};
  if(D.sira!==kim) return {hata:"Sıra sende değil."};
  D.pas++; kayitEkle(kim, "pas geçti");
  bitisKontrol();
  if(!D.bitti) D.sira = 1-kim;
  yayinla(); return {ok:true};
}
function degistirIsle(kim, harfler){
  if(D.bitti) return {hata:"Oyun bitti."};
  if(D.sira!==kim) return {hata:"Sıra sende değil."};
  if(D.torba.length < 7) return {hata:"Torbada 7'den az taş var, değişemezsin."};
  const el = D.eller[kim].slice();
  for(const h of harfler){ const p = el.indexOf(h); if(p<0) return {hata:"Elinde olmayan taş."}; el.splice(p,1); }
  D.eller[kim] = el;
  doldur(D.eller[kim]);
  harfler.forEach(h=>D.torba.push(h));
  for(let i=D.torba.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [D.torba[i],D.torba[j]]=[D.torba[j],D.torba[i]]; }
  D.pas = 0;
  kayitEkle(kim, harfler.length + " taş değiştirdi");
  D.sira = 1-kim;
  yayinla(); return {ok:true};
}

/* ---------------- bağlantı ---------------- */
function baglantiKur(c){
  baglanti = c;
  c.on("open", ()=>{
    $("giris").style.display = "none"; $("oyun").style.display = "block";
    if(benHost) oyunuBaslat();
    gonder({tip:"ad", ad:benAd});
  });
  c.on("data", m=>{
    if(m.tip==="ad"){ oAd = m.ad || oAd; if(G) ciz(); return; }
    if(m.tip==="sohbet"){ sohbetYaz(1, m.metin); sesCal("sohbet"); return; }
    if(m.tip==="kalp"){ kalpPatlat(m.emoji||"💖"); sesCal("kalp"); return; }
    if(benHost){
      let s = null;
      if(m.tip==="hamle")    s = hamleIsle(1, m.yerler);
      if(m.tip==="pas")      s = pasIsle(1);
      if(m.tip==="degistir") s = degistirIsle(1, m.harfler);
      if(s && s.hata) gonder({tip:"hata", m:s.hata});
    } else {
      if(m.tip==="durum"){ G = m.v; gecici=[]; secili=-1; degisModu=false; degisSecim.clear(); ciz(); }
      if(m.tip==="hata"){ $("uyari").textContent = m.m; }
    }
  });
  c.on("close", ()=>{ $("uyari").textContent = "Bağlantı koptu 😢"; });
}

$("kurBtn").onclick = ()=>{
  const kod = rastgeleKod(); benHost = true; benim = 0;
  $("durum").textContent = "Oda kuruluyor…";
  peer = new Peer("sevgilim-kelime-"+kod);
  peer.on("open", ()=>{ $("kod").textContent = kod; $("durum").textContent = "Kodu gönder, o katılınca başlıyoruz."; });
  peer.on("error", e=>$("durum").textContent = "Hata: "+e.type);
  peer.on("connection", baglantiKur);
};
$("katilBtn").onclick = ()=>{
  const kod = ($("kodGiris").value||"").trim().toUpperCase();
  if(kod.length<4){ $("durum").textContent = "4 haneli kodu yaz."; return; }
  benHost = false; benim = 1;
  $("durum").textContent = "Bağlanılıyor…";
  peer = new Peer();
  peer.on("open", ()=>{ baglantiKur(peer.connect("sevgilim-kelime-"+kod, {reliable:true})); });
  peer.on("error", e=>$("durum").textContent = "Bağlanamadı ("+e.type+"). Kodu kontrol et.");
};

/* ---------------- ekran ---------------- */
const ETIKET = {k3:"K3", k2:"K2", h3:"H3", h2:"H2"};

function ciz(){
  if(!G) return;
  const benimSira = G.sira === benim;
  $("pBen").textContent = benAd + ": " + G.puan[benim];
  $("pO").textContent   = oAd + ": " + G.puan[1-benim];
  $("pBen").className = "p" + (benimSira && !G.bitti ? " sira" : "");
  $("pO").className   = "p" + (!benimSira && !G.bitti ? " sira" : "");
  $("torba").textContent = "Torba: " + G.torba;

  const tahta = $("tahta");
  tahta.innerHTML = "";
  const gh = {}; gecici.forEach(g=>gh[g.i]=g);
  for(let i=0;i<225;i++){
    const d = document.createElement("div");
    const tas = G.tahta[i] || gh[i];
    let sinif = "h";
    if(tas) sinif += " tas" + (gh[i] ? " yeni" : "") + (tas.joker ? " joker" : "");
    else if(i===MERKEZ) sinif += " merkez";
    else if(CARPAN[i]) sinif += " " + CARPAN[i];
    d.className = sinif;
    if(tas){
      d.textContent = tas.h;
      if(!tas.joker){ const s = document.createElement("sub"); s.textContent = PUAN[tas.h]; d.appendChild(s); }
    } else {
      d.textContent = i===MERKEZ ? "★" : (ETIKET[CARPAN[i]] || "");
    }
    d.onclick = ()=>kareTikla(i);
    tahta.appendChild(d);
  }

  const el = $("el");
  el.innerHTML = "";
  (G.el||[]).forEach((h, idx)=>{
    const d = document.createElement("div");
    if(gecici.some(g=>g.elIndex===idx)){ d.className="t"; d.style.visibility="hidden"; el.appendChild(d); return; }
    d.className = "t" + (secili===idx ? " sec" : "") + (degisSecim.has(idx) ? " degis" : "");
    d.textContent = h==="*" ? "★" : h;
    if(h!=="*"){ const s = document.createElement("sub"); s.textContent = PUAN[h]; d.appendChild(s); }
    d.onclick = ()=>tasTikla(idx);
    el.appendChild(d);
  });

  $("onay").disabled = !benimSira || G.bitti;
  $("pas").disabled = !benimSira || G.bitti;
  $("degistir").disabled = !benimSira || G.bitti || G.torba < 7;
  $("degistir").textContent = degisSecim.size ? "Değiştir ("+degisSecim.size+")" : "Değiştir";

  $("kayit").innerHTML = "";
  (G.kayit||[]).slice().reverse().forEach(k=>{
    const d = document.createElement("div");
    d.textContent = (k.o===benim ? benAd+": " : oAd+": ") + k.m;
    $("kayit").appendChild(d);
  });
  if(G.bitti){
    const fark = G.puan[benim] - G.puan[1-benim];
    $("uyari").textContent = fark>0 ? "Oyun bitti — kazandın! 🎉"
                          : fark<0 ? "Oyun bitti — o kazandı 💛" : "Oyun bitti — berabere!";
  }
}

function tasTikla(idx){
  if(!G || G.sira!==benim || G.bitti) return;
  $("uyari").textContent = "";
  if(degisModu){ degisSecim.has(idx) ? degisSecim.delete(idx) : degisSecim.add(idx); }
  else { secili = secili===idx ? -1 : idx; }
  ciz();
}

function kareTikla(i){
  if(!G || G.sira!==benim || G.bitti) return;
  $("uyari").textContent = "";
  const g = gecici.find(x=>x.i===i);
  if(g){ gecici = gecici.filter(x=>x!==g); ciz(); return; }
  if(G.tahta[i] || secili<0) return;
  const harf = G.el[secili];
  const yer = secili;
  if(harf==="*"){
    jokerSor(h=>{ gecici.push({i, harf:h, joker:true, elIndex:yer}); secili=-1; ciz(); });
  } else {
    gecici.push({i, harf, joker:false, elIndex:yer});
    secili = -1; ciz();
  }
}

function jokerSor(geri){
  const k = $("jokerHarfler"); k.innerHTML = "";
  HARFLER.forEach(h=>{
    const b = document.createElement("button");
    b.textContent = h;
    b.onclick = ()=>{ $("jokerPerde").style.display = "none"; geri(h); };
    k.appendChild(b);
  });
  $("jokerPerde").style.display = "flex";
}

$("geriAl").onclick = ()=>{ gecici=[]; secili=-1; degisModu=false; degisSecim.clear(); $("uyari").textContent=""; ciz(); };

$("onay").onclick = ()=>{
  if(!gecici.length){ $("uyari").textContent = "Önce tahtaya taş koy."; return; }
  const yerler = gecici.map(g=>({i:g.i, harf:g.harf, joker:g.joker}));
  const on = kelimeTopla(G.tahta, yerler);
  if(on.hata){ $("uyari").textContent = on.hata; return; }
  if(benHost){
    const s = hamleIsle(0, yerler);
    if(s.hata){ $("uyari").textContent = s.hata; return; }
    gecici=[]; secili=-1; ciz();
  } else {
    gonder({tip:"hamle", yerler});
    gecici=[]; secili=-1; ciz();
  }
};

$("pas").onclick = ()=>{
  gecici=[]; secili=-1; degisModu=false; degisSecim.clear();
  if(benHost){ const s = pasIsle(0); if(s.hata) $("uyari").textContent = s.hata; }
  else gonder({tip:"pas"});
};

$("degistir").onclick = ()=>{
  if(!degisSecim.size){
    degisModu = true; gecici = []; secili = -1;
    $("uyari").textContent = "Değişecek taşlara dokun, sonra tekrar Değiştir'e bas.";
    ciz(); return;
  }
  const harfler = [...degisSecim].map(i=>G.el[i]);
  degisSecim.clear(); degisModu = false; secili = -1; gecici = [];
  if(benHost){ const s = degistirIsle(0, harfler); if(s.hata) $("uyari").textContent = s.hata; }
  else gonder({tip:"degistir", harfler});
};
/* ---------------- ses ---------------- */
let sesAcik = true, AC = null;
const ac = ()=>{ if(!AC) AC = new (window.AudioContext||window.webkitAudioContext)(); return AC; };
function ton(f, sure, tip, hacim, gecikme){
  if(!sesAcik) return;
  try{
    const c = ac(); const o = c.createOscillator(), g = c.createGain();
    o.type = tip || "sine"; o.frequency.value = f;
    const t0 = c.currentTime + (gecikme||0);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.linearRampToValueAtTime(hacim||0.14, t0+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0+(sure||0.2));
    o.connect(g); g.connect(c.destination);
    o.start(t0); o.stop(t0+(sure||0.2)+0.05);
  }catch(e){}
}
function sesCal(ad){
  if(ad==="tas")    ton(660,0.08,"triangle",0.12);
  if(ad==="geri")   ton(300,0.10,"triangle",0.10);
  if(ad==="hamle")  [523,659,784].forEach((f,i)=>ton(f,0.22,"sine",0.13,i*0.07));
  if(ad==="bingo")  [523,659,784,1047,1319].forEach((f,i)=>ton(f,0.35,"sine",0.15,i*0.09));
  if(ad==="hata"){  ton(180,0.22,"sawtooth",0.08); ton(140,0.26,"sawtooth",0.07,0.09); }
  if(ad==="kalp")   [880,1175].forEach((f,i)=>ton(f,0.25,"sine",0.12,i*0.08));
  if(ad==="sohbet") ton(980,0.10,"sine",0.10);
}

/* ---------------- efektler ---------------- */
function kalpPatlat(em, adet){
  const k = document.createElement("div"); k.className = "patlama";
  for(let i=0;i<(adet||22);i++){
    const s = document.createElement("span");
    s.textContent = em;
    s.style.left = (Math.random()*90+5)+"vw";
    s.style.top  = (Math.random()*65+25)+"vh";
    s.style.fontSize = (18+Math.random()*30)+"px";
    s.style.animationDelay = (Math.random()*0.5)+"s";
    k.appendChild(s);
  }
  document.body.appendChild(k);
  setTimeout(()=>k.remove(), 2800);
}

/* ---------------- sohbet ---------------- */
const EMOJILER = ["💛","😘","🤗","😂","🥰","😭","👏","🔥","🤔","😴","🙈","💪","🎉","😡","🍀"];
function sohbetYaz(kim, metin){
  const d = document.createElement("div");
  d.className = "msj " + (kim ? "o" : "ben");
  const et = document.createElement("i"); et.className = "msjAd"; et.textContent = kim ? oAd : benAd;
  const gv = document.createElement("span"); gv.textContent = metin;
  d.appendChild(et); d.appendChild(gv);
  const w = document.getElementById("sohbet");
  w.appendChild(d); w.scrollTop = w.scrollHeight;
  while(w.children.length > 60) w.firstChild.remove();
}
function sohbetKur(){
  const bar = document.getElementById("emojiBar");
  EMOJILER.forEach(e=>{
    const b = document.createElement("button");
    b.textContent = e;
    b.onclick = ()=>{ const g = document.getElementById("sohbetGiris"); g.value += e; g.focus(); };
    bar.appendChild(b);
  });
  document.getElementById("sohbetGonder").onclick = ()=>{
    const g = document.getElementById("sohbetGiris");
    const v = g.value.trim(); if(!v) return;
    sohbetYaz(0, v); gonder({tip:"sohbet", metin:v}); g.value = "";
  };
  document.getElementById("sohbetGiris").addEventListener("keydown", e=>{
    if(e.key === "Enter") document.getElementById("sohbetGonder").click();
  });
  document.getElementById("kalpBtn").onclick = ()=>{
    kalpPatlat("💖"); sesCal("kalp"); gonder({tip:"kalp", emoji:"💖"});
  };
  document.getElementById("sesBtn").onclick = ()=>{
    sesAcik = !sesAcik;
    document.getElementById("sesBtn").textContent = sesAcik ? "🔊 Ses açık" : "🔇 Ses kapalı";
    if(sesAcik) sesCal("tas");
  };
}
sohbetKur();

/* ---------------- kelime anlamları ---------------- */
const anlamOnbellek = {};
async function anlamGetir(k){
  const a = k.toLocaleLowerCase("tr");
  if(a in anlamOnbellek) return anlamOnbellek[a];
  try{
    const r = await fetch("https://sozluk.gov.tr/gts?ara=" + encodeURIComponent(a));
    const j = await r.json();
    const t = (Array.isArray(j) && j[0] && j[0].anlamlarListe && j[0].anlamlarListe[0])
      ? j[0].anlamlarListe[0].anlam : null;
    anlamOnbellek[a] = t; return t;
  }catch(e){ anlamOnbellek[a] = null; return null; }
}
async function anlamlariGoster(metin){
  const bas = (metin.split(" · ")[0] || "");
  const kelimeler = bas.split(" + ").map(s=>s.trim()).filter(s=>/^[A-ZÇĞİÖŞÜ]{2,}$/.test(s));
  for(const k of kelimeler){
    const a = await anlamGetir(k);
    const d = document.createElement("div"); d.className = "anlam";
    d.innerHTML = "<b>" + k + "</b>: " + (a ? a : "TDK'da açıklama bulunamadı.");
    const kutu = document.getElementById("anlamlar");
    kutu.prepend(d);
    while(kutu.children.length > 6) kutu.lastChild.remove();
  }
}

/* ---------------- kancalar ---------------- */
const _ciz = ciz; let sonKayitSayi = -1;
ciz = function(){
  _ciz();
  if(!G) return;
  const n = (G.kayit||[]).length;
  if(sonKayitSayi >= 0 && n > sonKayitSayi){
    const son = G.kayit[n-1].m || "";
    if(/\+\d/.test(son)){
      const bingo = son.indexOf("bingo") >= 0;
      sesCal(bingo ? "bingo" : "hamle");
      if(bingo) kalpPatlat("🎉", 30);
      anlamlariGoster(son);
    }
  }
  sonKayitSayi = n;
};

const _kareTikla = kareTikla;
kareTikla = function(i){
  const o = gecici.length;
  _kareTikla(i);
  if(gecici.length > o) sesCal("tas");
  else if(gecici.length < o) sesCal("geri");
};

let sonUyari = "";
new MutationObserver(()=>{
  const t = document.getElementById("uyari").textContent;
  if(t && t !== sonUyari){
    sonUyari = t;
    if(t.indexOf("bitti") < 0 && t.indexOf("Değişecek") < 0) sesCal("hata");
    if(t.indexOf("kazandın") >= 0) kalpPatlat("🏆", 26);
  }
  if(!t) sonUyari = "";
}).observe(document.getElementById("uyari"), {childList:true, characterData:true, subtree:true});

/* ---------------- isimler ---------------- */
let benAd = "Sen", oAd = "O";
document.querySelectorAll(".kim").forEach(b=>{
  b.onclick = ()=>{
    document.querySelectorAll(".kim").forEach(x=>x.classList.remove("secili"));
    b.classList.add("secili");
    benAd = b.dataset.ad;
    oAd = benAd === "Ayşe Nur" ? "Oğuzhan" : "Ayşe Nur";
    document.getElementById("durum").textContent = "Merhaba " + benAd + "! Oda kur ya da kodu gir.";
    sesCal("tas");
  };
});
["kurBtn","katilBtn"].forEach(id=>{
  const el = document.getElementById(id); const f = el.onclick;
  el.onclick = ()=>{
    if(!document.querySelector(".kim.secili")){
      document.getElementById("durum").textContent = "Önce ismini seç 💛";
      sesCal("hata"); return;
    }
    f();
  };
});
